<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Sign In | CodeBihin Messaging</title><link rel="stylesheet" href="assets/admin.css"><style>.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);background:#fff;border:1px solid #e8edf5;border-radius:20px;padding:32px;box-shadow:0 20px 60px #14294a12}.loginbox h1{margin:0 0 8px}.loginbox .formfield{margin:16px 0}.loginbox input{width:100%}</style></head><body><div class="loginwrap"><div class="loginbox"><div class="brand" style="padding:0 0 22px;color:#132447">CodeBihin<span>.</span><div class="muted" style="font-size:11px;letter-spacing:1px">MESSAGING ADMIN WORKSPACE</div></div><h1>Welcome back</h1><p class="muted">Sign in with your authorized administrator account.</p><form id="loginForm"><div class="formfield"><label>Email address</label><input id="email" type="email" autocomplete="username" required></div><div class="formfield"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="loginBtn" style="width:100%;margin-top:8px">Sign in to workspace</button><p class="message" id="loginMsg"></p></form><p class="muted" style="font-size:12px;margin-top:24px">Access is restricted to accounts enabled in the Firebase admins collection.</p></div></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="assets/core.js"></script><script>auth.onAuthStateChanged(async user=>{if(!user)return;try{const d=await db.collection("admins").doc(user.uid).get();if(d.exists&&d.data().active===true)location.href="dashboard.html";else await auth.signOut()}catch(e){$("loginMsg").textContent=e.message}});$("loginForm").addEventListener("submit",async e=>{e.preventDefault();const b=$("loginBtn");b.disabled=true;$("loginMsg").textContent="Signing in…";try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value)}catch(err){$("loginMsg").textContent=err.code==="auth/invalid-credential"?"Email or password is incorrect.":err.message}finally{b.disabled=false}});</script></body></html>
