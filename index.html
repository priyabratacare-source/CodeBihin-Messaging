<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10234f">
  <title>CodeBihin Messaging</title>
  <meta http-equiv="refresh" content="2;url=./admin/">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#0d1b3d,#1747a6);font-family:Inter,system-ui,Arial,sans-serif;color:#fff}.panel{width:min(100%,520px);padding:38px 28px;text-align:center;border:1px solid #ffffff30;border-radius:24px;background:#ffffff12;box-shadow:0 24px 70px #0003;backdrop-filter:blur(12px)}.mark{width:66px;height:66px;margin:0 auto 18px;border-radius:20px;background:#fff;color:#1747a6;display:grid;place-items:center;font-size:30px;font-weight:900}.muted{color:#d8e4ff;line-height:1.6}a{display:inline-block;margin-top:18px;padding:13px 22px;border-radius:12px;background:#fff;color:#1747a6;text-decoration:none;font-weight:800}.small{font-size:13px;color:#c4d4f8;margin-top:20px}
  </style>
  <script>
    window.setTimeout(function(){ window.location.replace("./admin/"); }, 900);
  </script>
</head>
<body>
  <main class="panel">
    <div class="mark">CB</div>
    <h1>CodeBihin Messaging</h1>
    <p class="muted">Secure messaging administration portal.<br>Opening the admin portal…</p>
    <a href="./admin/">Open Admin Portal</a>
    <p class="small">If you are not redirected automatically, use the button above.</p>
  </main>
</body>
</html>
